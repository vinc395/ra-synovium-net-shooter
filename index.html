<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#140817" />
    <meta
      name="description"
      content="Arcade shooter set in rheumatoid arthritis synovium: steer a neutrophil, trap inflammatory stimuli with NETs and balance inflammation against NET-mediated tissue damage."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NET Shooter" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>RA Synovium NET Shooter</title>
  </head>
  <body class="device-desktop">
    <div id="app"></div>
    <div class="screen-fx vignette" aria-hidden="true"></div>
    <div class="screen-fx damage" id="damageFx" aria-hidden="true"></div>

    <div class="hud" id="hud">
      <section class="panel stats" aria-label="Status">
        <div class="title-row">
          <span class="game-title">RA Synovium NET Shooter</span>
          <span id="waveLabel" class="chip">Wave 1</span>
        </div>
        <div class="meter">
          <span class="meter-label"><span class="long">Neutrophil health</span><span class="short">Health</span></span>
          <div class="bar"><div id="healthBar" class="fill health"></div></div>
          <span id="healthValue" class="meter-value">100</span>
        </div>
        <div class="meter">
          <span class="meter-label"><span class="long">Inflammation</span><span class="short">Inflam.</span></span>
          <div class="bar"><div id="inflammationBar" class="fill inflammation"></div></div>
          <span id="inflammationValue" class="meter-value">25</span>
        </div>
        <div class="meter">
          <span class="meter-label"><span class="long">NET tissue damage</span><span class="short">NET damage</span></span>
          <div class="bar net-bar"><div id="netBar" class="fill net"></div><i class="threshold"></i></div>
          <span id="netValue" class="meter-value">0</span>
        </div>
        <div class="sub-row">
          <span id="clearedValue">Cleared 0/55</span>
          <span>Stabilise <b id="timeValue">02:30</b></span>
        </div>
      </section>

      <section class="panel scoreboard" aria-label="Score">
        <div class="score">
          <span class="score-label">Score</span>
          <span id="scoreValue" class="score-value">0</span>
          <span id="comboValue" class="combo"></span>
        </div>
        <div class="hud-buttons">
          <button id="legendButton" class="icon-btn" aria-label="Show targets legend" aria-expanded="false" title="Targets"></button>
          <button id="muteButton" class="icon-btn" aria-label="Mute sound" title="Sound (M)"></button>
          <button id="pauseButton" class="icon-btn" aria-label="Pause" title="Pause (Esc)"></button>
        </div>
      </section>

      <section class="panel legend" id="legend" aria-label="Targets legend">
        <div class="legend-title">
          <span>NET targets</span>
          <button class="legend-close" aria-label="Hide legend">×</button>
        </div>
        <div id="legendBody"></div>
      </section>

      <div class="burst-meter" id="burstMeter">
        <div class="burst-track"><div class="burst-fill" id="burstFill"></div></div>
        <span class="burst-label">NET burst <kbd>E</kbd></span>
      </div>

      <div id="warnings" class="warnings" aria-live="polite"></div>
      <div id="banner" class="banner" aria-live="polite"></div>
      <div id="toast" class="toast" aria-live="polite"></div>
      <div id="floaters" class="layer" aria-hidden="true"></div>
      <div id="indicators" class="layer" aria-hidden="true"></div>
      <div id="lockOn" class="lock-on" aria-hidden="true"></div>
    </div>

    <div class="touch-ui" id="touchUi">
      <div class="joystick-hint" aria-hidden="true"><span>Move</span></div>
      <div class="joystick" id="joystick" aria-hidden="true"><div class="knob" id="joystickKnob"></div></div>
      <button class="touch-btn fire" id="fireButton" aria-label="Fire NET (hold)">NET</button>
      <button class="touch-btn dash" id="dashButton" aria-label="Dash">Dash</button>
      <button class="touch-btn burst" id="burstButton" aria-label="NET burst"><span>Burst</span></button>
    </div>

    <div class="overlay show" id="overlay" role="dialog" aria-modal="true" aria-label="Game menu">
      <div class="card" id="card">
        <h1>RA Synovium <span>NET Shooter</span></h1>
        <p class="lead" id="loadingText">Growing synovial tissue…</p>
      </div>
    </div>

    <noscript>
      <p class="noscript">This game needs JavaScript and WebGL 2 to run.</p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
